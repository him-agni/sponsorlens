# Render Blueprint: the FastAPI engine as a free web service and the React app as a static site. $0.
# The free web service sleeps when idle and wakes in about a minute; its disk is wiped on sleep.
services:
  - type: web
    name: sponsorlens
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Spending limits for the public demo: single checks run live under a daily dollar cap and an
      # hourly request limit; batches show the recorded run. The cap resets when the service restarts.
      - key: LIVE_BATCHES
        value: "false"
      - key: DAILY_BUDGET_USD
        value: "1"
      - key: HOURLY_REQUESTS
        value: "60"
      # The last live day, Pacific time; after it the demo makes no paid calls. Also the code's default.
      - key: LIVE_UNTIL
        value: "2026-12-15"
      # Must match the static site's URL below; a JSON list.
      - key: CORS_ORIGINS
        value: '["https://sponsorlens-web.onrender.com"]'

  - type: web
    name: sponsorlens-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Must match the API service's URL above.
      - key: VITE_API_URL
        value: https://sponsorlens.onrender.com
