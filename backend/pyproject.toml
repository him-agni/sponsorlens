[project]
name = "sponsorlens"
version = "0.1.0"
description = "Work-authorization verdicts for job postings, backed by a hand-built concurrent pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
